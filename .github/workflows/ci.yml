name: Pomins checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pomins_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POMINS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pomins_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3181
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: fixture-public-key
          NEXT_PUBLIC_APP_URL: http://localhost:3192
      - run: npx playwright install --with-deps chromium
      - name: Browser regression with disposable SQL and decimal contracts
        shell: bash
        run: |
          set -euo pipefail
          fixture_pid=""
          cleanup() {
            if [ -n "$fixture_pid" ]; then
              kill "$fixture_pid" 2>/dev/null || true
              wait "$fixture_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          start_fixture() {
            node tests/support/save-gateway.mjs > "$RUNNER_TEMP/save-gateway.log" 2>&1 &
            fixture_pid=$!
            for attempt in {1..30}; do
              if curl --fail --silent --output /dev/null http://127.0.0.1:3181/__test/info; then
                return 0
              fi
              if ! kill -0 "$fixture_pid" 2>/dev/null; then
                cat "$RUNNER_TEMP/save-gateway.log"
                return 1
              fi
              sleep 1
            done
            cat "$RUNNER_TEMP/save-gateway.log"
            return 1
          }
          start_fixture
          npm run test:e2e
          cleanup
          fixture_pid=""
          export POMINS_TEST_DECIMAL_NEEDS=1
          start_fixture
          npx playwright test fractional-needs.spec.ts
        env:
          POMINS_TEST_SERVER_MODE: production
          POMINS_TEST_PORT: '3192'
          POMINS_SAVE_FIXTURE_ORIGIN: http://127.0.0.1:3181
          POMINS_TEST_ELAPSED_NEEDS: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
  economy-foundation:
    # Separate cluster: historical concurrency tests also bootstrap database roles.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pomins_foundation_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POMINS_FOUNDATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pomins_foundation_test
      POMINS_FOUNDATION_RESTORE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pomins_foundation_restore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/integration/economy-foundation-postgres.test.ts --maxWorkers=1
      - name: Rehearse restoration with matching PostgreSQL tools
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" pg_dump -U postgres -Fc pomins_foundation_test > "$RUNNER_TEMP/foundation.dump"
          docker exec "$PG_CONTAINER" createdb -U postgres pomins_foundation_restore
          docker exec -i "$PG_CONTAINER" pg_restore -U postgres --exit-on-error -d pomins_foundation_restore < "$RUNNER_TEMP/foundation.dump"
          node scripts/compare-economy-restore.mjs
  paid-care:
    # Separate cluster: historical concurrency tests also bootstrap database roles.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pomins_paid_care_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POMINS_PAID_CARE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pomins_paid_care_test
      POMINS_PAID_CARE_RESTORE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pomins_paid_care_restore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/integration/fixed-price-care-postgres.test.ts --maxWorkers=1
      - name: Rehearse restoration with matching PostgreSQL tools
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" pg_dump -U postgres -Fc pomins_paid_care_test > "$RUNNER_TEMP/foundation.dump"
          docker exec "$PG_CONTAINER" createdb -U postgres pomins_paid_care_restore
          docker exec -i "$PG_CONTAINER" pg_restore -U postgres --exit-on-error -d pomins_paid_care_restore < "$RUNNER_TEMP/foundation.dump"
          node scripts/compare-economy-restore.mjs
