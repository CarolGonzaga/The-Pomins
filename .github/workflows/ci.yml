name: Pomins checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pomins_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POMINS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pomins_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          POMINS_TEST_SERVER_MODE: production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
  economy-foundation:
    # Separate cluster: historical concurrency tests also bootstrap database roles.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pomins_foundation_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POMINS_FOUNDATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pomins_foundation_test
      POMINS_FOUNDATION_RESTORE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pomins_foundation_restore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/integration/economy-foundation-postgres.test.ts --maxWorkers=1
      - name: Rehearse restoration with matching PostgreSQL tools
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" pg_dump -U postgres -Fc pomins_foundation_test > "$RUNNER_TEMP/foundation.dump"
          docker exec "$PG_CONTAINER" createdb -U postgres pomins_foundation_restore
          docker exec -i "$PG_CONTAINER" pg_restore -U postgres --exit-on-error -d pomins_foundation_restore < "$RUNNER_TEMP/foundation.dump"
          node scripts/compare-economy-restore.mjs
